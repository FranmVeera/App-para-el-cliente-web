<div class="login-box">
  <div class="logo-login">
    <img src="assets/logo-uleam-full.png" alt="Universidad Laica Eloy Alfaro de Manabí" class="logo-img-full">
  </div>
  <h2>Iniciar Sesión</h2>
  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="usuario">Usuario / Correo</label>
      <input type="text" id="usuario" name="usuario" required aria-describedby="error-usuario" />
      <div id="error-usuario" class="error-message" role="alert"></div>
    </div>
    <div class="form-group">
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" required aria-describedby="error-contrasena" />
      <div id="error-contrasena" class="error-message" role="alert"></div>
    </div>
    <button type="submit">Iniciar Sesión</button>
    <a href="#" class="forgot-password">¿Olvidó su contraseña?</a>
  </form>
</div>

<style>
.error-message {
  color: #e74c3c;
  font-size: 0.85rem;
  margin-top: 5px;
  min-height: 18px;
}
</style>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const usuario = document.getElementById('usuario').value.trim();
  const contrasena = document.getElementById('contrasena').value;

  let valido = true;
  document.querySelectorAll('.error-message').forEach(el => el.textContent = '');

  if (!usuario) {
    document.getElementById('error-usuario').textContent = '⚠️ Este campo es obligatorio.';
    valido = false;
  }
  if (!contrasena) {
    document.getElementById('error-contrasena').textContent = '⚠️ Este campo es obligatorio.';
    valido = false;
  }

  if (valido) {
    alert('✅ Inicio de sesión exitoso');
    cargarInterfaz('panel.html', true);
  }
});
</script>
