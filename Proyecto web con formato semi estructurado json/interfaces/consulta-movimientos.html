<div class="container">
  <h2>Consulta de Movimientos</h2>
  <div class="form-grid full">
    <div class="form-group">
      <label>Fecha inicial</label>
      <input type="date" id="fechaInicio" required>
      <div id="error-fecha-inicio" class="error-message"></div>
    </div>
    <div class="form-group">
      <label>Fecha final</label>
      <input type="date" id="fechaFin" required>
      <div id="error-fecha-fin" class="error-message"></div>
    </div>
    <div class="form-group">
      <label>Buscar por placa o cédula (opcional)</label>
      <input type="text" id="filtro">
    </div>
    <button class="btn" type="button" onclick="buscarMovimientos()">Buscar</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Fecha y hora</th>
          <th>Placa</th>
          <th>Tipo</th>
          <th>Conductor</th>
        </tr>
      </thead>
      <tbody id="tbodyMovimientos">
      </tbody>
    </table>
  </div>
</div>
